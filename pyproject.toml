[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finger-impedance-analysis"
version = "0.2.0"
description = "HD-sEMG feature extraction, force analysis, activation metrics, and displacement-force stiffness estimation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Batuhan Toker", email = "bthntoker@gmail.com" },
]
keywords = [
    "EMG", "finger", "impedance", "stiffness", "biomechanics",
    "HD-sEMG", "machine learning", "signal processing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "pandas>=2.0",
]

[project.optional-dependencies]
image = [
    "opencv-python>=4.8",
    "scikit-image>=0.21",
]
hyser = [
    "wfdb>=4.1",
]
malesevic = [
    "mat73>=0.60",
]
dev = [
    "build>=1.2",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]
all = [
    "opencv-python>=4.8",
    "scikit-image>=0.21",
    "mat73>=0.60",
    "wfdb>=4.1",
]

[project.urls]
Homepage = "https://github.com/batuhantoker/finger-impedance-analysis"
Repository = "https://github.com/batuhantoker/finger-impedance-analysis"
Issues = "https://github.com/batuhantoker/finger-impedance-analysis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["finger_impedance*"]

[tool.setuptools.package-data]
finger_impedance = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
